name: Noetic Organism Omega v2.2.0 CI (Cross-Platform C11 + 0-Bit Parity + ASan/UBSan + 68-Theorem 6-Kernel Lean 4.35.0 + Paper + Timestamps)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  c11-cross-platform:
    name: C11 Engine, 825 Checks, 100 Milestones & Property Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Verify SHA-256 Integrity Manifests (CHECKSUMS.sha256 & data/MANIFEST.sha256)
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -euo pipefail
          sha256sum -c CHECKSUMS.sha256
          sha256sum -c data/MANIFEST.sha256

      - name: Build & Verify on Linux (GCC -ffp-contract=off -Werror + 825 Checks + 100 Milestones + 0-Byte Receipt Diff + ASan/UBSan)
        if: matrix.os == 'ubuntu-latest'
        run: |
          chmod +x build_linux.sh
          ./build_linux.sh
          ./bin/noetic_engine_linux gates results/m9_native_release_gates.json
          ./bin/noetic_engine_linux hw24 results/m10_hw24_receipt.json
          ./bin/noetic_engine_linux soft40 48 results/m10_soft40_receipt.json
          ./bin/noetic_engine_linux freak100 48 results/m10_freak100_receipt.json
          ./bin/noetic_engine_linux novel100 48 results/m10_novel100_receipt.json
          ./bin/noetic_engine_linux life500 48 results/m10_life500_receipt.json
          ./bin/noetic_engine_linux milestones100 results/m10_milestones_100_receipt.json
          ./bin/noetic_engine_linux e1 48 results/m8_e1_ablation_sweep.json results/m8_e1_ablation_sweep.csv
          ./bin/noetic_engine_linux e2 48 results/m8_e2_cognitive_49.json results/m8_e2_cognitive_49.csv
          ./bin/noetic_engine_linux e3 results/m8_e3_scaling_bench.json results/m8_e3_scaling_bench.csv
          ./bin/noetic_engine_linux export-lean 5001 /tmp/linux_LiveC11Receipt.lean
          diff -u lean/NoeticProofs/LiveC11Receipt.lean /tmp/linux_LiveC11Receipt.lean
          node scripts/seed_firewall.mjs
          node scripts/audit_zero_theater.mjs
          node tests/noetic_prop.test.mjs
          node examples/run_quick_demo.mjs

          # AddressSanitizer + UndefinedBehaviorSanitizer runtime verification
          gcc -std=c11 -O1 -g -ffp-contract=off -Wall -Wextra -Werror -Wno-unused-parameter -fsanitize=address,undefined -Iinclude \
            src/noetic_rng.c src/noetic_stats.c src/noetic_organism.c src/noetic_gates_core.c \
            src/noetic_hw24.c src/noetic_soft40.c src/noetic_freak100.c src/noetic_novel100.c \
            src/noetic_life500.c src/noetic_milestones100.c src/noetic_eval.c src/main_cli.c \
            -o bin/noetic_engine_asan -lm
          ./bin/noetic_engine_asan test
          ./bin/noetic_engine_asan gates

      - name: Upload M8 E3 Scaling Benchmark Receipt (report-only tracking)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: noetic-benchmarks-json
          path: results/m8_e3_scaling_bench.json

      - name: Build & Verify on Windows (GCC/MinGW -ffp-contract=off -Werror + 0-Byte Receipt Diff + Tests + Property Check)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin, results | Out-Null
          gcc -std=c11 -O3 -ffp-contract=off -Wall -Wextra -Werror -Wno-unused-parameter -Iinclude `
            src/noetic_rng.c src/noetic_stats.c src/noetic_organism.c src/noetic_gates_core.c `
            src/noetic_hw24.c src/noetic_soft40.c src/noetic_freak100.c src/noetic_novel100.c `
            src/noetic_life500.c src/noetic_milestones100.c src/noetic_eval.c src/main_cli.c `
            -o bin/noetic_engine.exe -lm
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\bin\noetic_engine.exe test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\bin\noetic_engine.exe gates results/m9_native_release_gates.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\bin\noetic_engine.exe export-lean 5001 "$env:TEMP\win_LiveC11Receipt.lean"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $a = [System.IO.File]::ReadAllBytes("lean/NoeticProofs/LiveC11Receipt.lean")
          $b = [System.IO.File]::ReadAllBytes("$env:TEMP\win_LiveC11Receipt.lean")
          if (($a.Length -ne $b.Length) -or (-not [System.Linq.Enumerable]::SequenceEqual($a, $b))) {
            throw "Windows MinGW LiveC11Receipt.lean differed from committed receipt!"
          }
          Write-Host "PASS: Windows MinGW LiveC11Receipt.lean is 0-byte identical to committed receipt!"
          node tests/noetic_prop.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node examples/run_quick_demo.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  lean4-6kernel-palomar:
    name: Pure Lean 4.35.0 — 68 Theorems, Cross-OS Receipt Diff, Negative/Tamper Gates & 6-Kernel Palomar Comparator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install bubblewrap for Palomar multi-kernel sandbox
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Install elan & pinned Lean 4.35.0 toolchain
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Verify 0-Byte Cross-OS Live C11 Receipt Parity & Build 68 Theorems + Isolated Challenge
        run: |
          mkdir -p bin
          cp lean/NoeticProofs/LiveC11Receipt.lean /tmp/committed_LiveC11Receipt.lean
          gcc -std=c11 -O3 -ffp-contract=off -Wall -Wextra -Werror -Wno-unused-parameter -Iinclude \
            src/noetic_rng.c src/noetic_stats.c src/noetic_organism.c src/noetic_gates_core.c \
            src/noetic_hw24.c src/noetic_soft40.c src/noetic_freak100.c src/noetic_novel100.c \
            src/noetic_life500.c src/noetic_milestones100.c src/noetic_eval.c src/main_cli.c \
            -o bin/noetic_engine_linux -lm
          ./bin/noetic_engine_linux export-lean 5001 lean/NoeticProofs/LiveC11Receipt.lean
          # Close ERRATA.md CI hole: fail loudly if Linux receipt differs by even 1 byte from committed receipt
          diff -u /tmp/committed_LiveC11Receipt.lean lean/NoeticProofs/LiveC11Receipt.lean
          echo "PASS: Regenerated Linux LiveC11Receipt.lean matches committed receipt with 0-byte diff!"
          cd lean
          lake build
          lake build Challenge
          lake env lean VerifyAxioms.lean > ../results/lean4-noetic-audit.txt
          cat ../results/lean4-noetic-audit.txt
          cd ..
          python3 scripts/check_readme_axioms.py
      - name: Verify All 6 Independent Kernels & Live Negative/Sorry-Tamper Rejection
        run: |
          cd lean
          lake env leanchecker --fresh Solution
          lake env leanchecker-paranoid --fresh Solution
          lake check --paranoid
          lake comparator --config comparator.json --paranoid
          cd ..
          python3 scripts/test_lean_negative.py --comparator

  paper-pdf-and-provenance:
    name: AMS-LaTeX White Paper, Blueprint, Timestamps, SHA256SUMS & SLSA Provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Tectonic
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://drop-sh.fullyjustified.net | sh
          sudo mv tectonic /usr/local/bin/tectonic
      - name: Verify Citations (offline cross-check), Blueprint, Dual Timestamps & Compile AMS-LaTeX + Clean-Room arXiv
        run: |
          python3 scripts/check_citations.py --offline
          python3 scripts/check_blueprint.py
          python3 scripts/stamp_timestamps.py --verify
          python3 scripts/build_paper.py
      - name: Generate SHA256SUMS
        run: |
          sha256sum dist/Donahue_2026_noetic_organism_omega.pdf dist/arxiv_submission.tar.gz results/lean4-noetic-audit.txt results/lean4-multi-kernel.txt results/citation-audit.json CHECKSUMS.sha256 CHECKSUMS.sha256.tsr CHECKSUMS.sha256.ots > SHA256SUMS
          cat SHA256SUMS
      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@v4
        continue-on-error: true
        with:
          subject-path: |
            dist/Donahue_2026_noetic_organism_omega.pdf
            dist/arxiv_submission.tar.gz
            SHA256SUMS

  audit-and-security:
    name: Build Standard v1.2.0 Audit & Report-Only Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build Standard v1.2.0 self-audit (report-only)
        continue-on-error: true
        run: bash scripts/audit-repo.sh .
      - name: Secret scan via gitleaks (report-only)
        continue-on-error: true
        run: |
          GITLEAKS_VER="8.21.2"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VER}/gitleaks_${GITLEAKS_VER}_linux_x64.tar.gz" | tar -xz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --no-banner --redact
