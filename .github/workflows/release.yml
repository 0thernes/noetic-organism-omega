# SPDX-License-Identifier: Apache-2.0
name: Automated Tag Release with SHA256SUMS & SLSA Provenance

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build Release Artifacts, SHA256SUMS & SLSA Attestation (${{ github.ref_name }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify Dual Cryptographic Timestamps & Blueprint
        run: |
          python3 scripts/stamp_timestamps.py --verify
          python3 scripts/check_blueprint.py
          python3 scripts/check_readme_axioms.py

      - name: Verify Frozen Release Assets & Compute SHA256SUMS
        run: |
          sha256sum \
            dist/Donahue_2026_noetic_organism_omega.pdf \
            dist/arxiv_submission.tar.gz \
            results/lean4-noetic-audit.txt \
            results/lean4-multi-kernel.txt \
            results/citation-audit.json \
            CHECKSUMS.sha256 \
            CHECKSUMS.sha256.tsr \
            CHECKSUMS.sha256.ots \
            croissant.json \
            ro-crate-metadata.json \
            codemeta.json > SHA256SUMS
          cat SHA256SUMS

      - name: Attest Build Provenance (SLSA / Sigstore Rekor)
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/Donahue_2026_noetic_organism_omega.pdf
            dist/arxiv_submission.tar.gz
            SHA256SUMS
            CHECKSUMS.sha256
            CHECKSUMS.sha256.tsr
            CHECKSUMS.sha256.ots

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              dist/Donahue_2026_noetic_organism_omega.pdf \
              dist/arxiv_submission.tar.gz \
              SHA256SUMS \
              CHECKSUMS.sha256 \
              CHECKSUMS.sha256.tsr \
              CHECKSUMS.sha256.ots \
              results/lean4-noetic-audit.txt \
              results/citation-audit.json \
              --clobber
          else
            gh release create "$TAG" \
              dist/Donahue_2026_noetic_organism_omega.pdf \
              dist/arxiv_submission.tar.gz \
              SHA256SUMS \
              CHECKSUMS.sha256 \
              CHECKSUMS.sha256.tsr \
              CHECKSUMS.sha256.ots \
              results/lean4-noetic-audit.txt \
              results/citation-audit.json \
              --title "Noetic Organism Omega ${TAG}" \
              --notes "Automated release for ${TAG}. Includes 11-page AMS-LaTeX white paper PDF, clean-room arXiv tarball, 68-theorem Lean 4.35.0 axiom audit, 22/22 live Crossref/arXiv citation audit, LF-normalized CHECKSUMS.sha256, DigiCert RFC 3161 (.tsr) + 3-calendar Bitcoin OpenTimestamps (.ots) proofs, and SLSA/Rekor build provenance attestation. Independent AI-assisted research under human direction; not peer-reviewed; 0/1,900 Mega-Atlas problems retired."
          fi
