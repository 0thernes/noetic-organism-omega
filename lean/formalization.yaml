schema_version: "0.4"
project: "noetic-organism-omega"
version: "2.1.0"
repository: "https://github.com/0thernes/noetic-organism-omega"
license: "Apache-2.0"
documentation_license: "CC-BY-4.0"
authors:
  - name: "Alexander Stephen Donahue"
    orcid: "0009-0006-8168-9648"
    affiliation: "Independent Researcher, Spokane, WA, USA"
    email: "0_0@0thernes.art"
    credit_roles:
      - Conceptualization
      - Methodology
      - Supervision
      - Validation
      - Writing - review & editing
toolchain: "leanprover/lean4:v4.35.0"
mathlib_dependency: false
module_system: true
lean_root: "lean"
spec_module: "lean/NoeticProofs/Spec.lean"
live_receipt_module: "lean/NoeticProofs/LiveC11Receipt.lean"
challenge_module: "lean/Challenge.lean"
solution_module: "lean/Solution.lean"
comparator_config: "lean/comparator.json"
audit_entrypoint: "lean/VerifyAxioms.lean"
theorem_count: 54
core_theorem_count: 48
non_vacuity_and_refutation_count: 6
permitted_axioms:
  - propext
  - Quot.sound
  - Classical.choice
forbidden_axioms:
  - sorryAx
  - Lean.ofReduceBool
  - Lean.trustCompiler
  - _native.bv_decide
kernels:
  - name: "Lean 4.35.0 reference kernel"
    command: "lake build && lake env leanchecker --fresh Solution"
  - name: "leanchecker-paranoid"
    command: "lake env leanchecker-paranoid --fresh Solution"
  - name: "lean4lean"
    command: "lake check --paranoid"
  - name: "nanoda_bin (Rust)"
    command: "lake env nanoda_bin nanoda.json"
  - name: "con-leche (--verified)"
    command: "lake env con-leche --verified sol.export"
  - name: "con-ron (--verified)"
    command: "lake env con-ron --verified sol.export"
comparator_command_ci: "cd lean && lake comparator --config comparator.json --paranoid"
automation_and_ai_disclosure:
  status: "AI-assisted research under human direction"
  tools: "Frontier LLM coding and formalization assistants (Claude / Gemini agentic workflows)"
  human_oversight: "Alexander Stephen Donahue set research goals, invariants, epistemic boundaries, and validated builds, multi-kernel audits, and receipts."
scope_and_non_formalized_disclaimers:
  formalized_scope:
    - "Field-sum conservation for guarded transfers on a 10-field unbounded-Int Lean model (Ledger10, not the 11-slot int64 C11 ledger), heat-field non-decrease, non-negativity preservation, solar inflow residual, closed-tick composition, and +1 leak detection (N01..N10, N36, N37, N49, N54)."
    - "Pair-projection identity for the forked observer, one-line region<4 edit-guard identity (not a hardware ACL proof), (w + d) - d = w, the numeral identity 2464 < 16384, XPBD area bound, packed b1.58 2-bit roundtrip & 5-trit/B uint8 radix, Q<=10 memory cap, 5-gear clock divisors, Philox domain key distinctness (N11, N25..N30, N33..N35, N38, N39, N50..N52)."
    - "Triangular-sum identity 2*sum1To n = n(n+1) and sum1To 48 = 1176, Holm-Bonferroni inflation bound, non-ceiling guard, sham symmetry, literal seed-range disjointness, anti-oracle separation, 18-bit ablation mask bound, and closed numeral identities recording Clean-Slate v3.0 counts (N12..N23, N31, N40..N47, N53). 18 of the 54 theorems are closed numeral identities that certify nothing about the engine."
    - "decide-checks of hard-coded constants exported by one C11 run (export-lean 5001); not a proof about C11 behaviour (N24, N32, N48)."
  not_formalized_in_lean:
    - "The C11 source files themselves (src/*.c) are NOT formally verified via VST/CompCert; bridge fidelity rests on live receipt export (N24/N32/N48), -Wall -Wextra -Werror, ASan/UBSan in CI, 5 compiled Anti-LARP mutants, and 825 native checks."
    - "Floating-point IEEE-754 transcendental approximations (noetic_exp_det/log_det/tanh_det) are empirically audited (max relative error 2.175e-16), not formally proved in Lean."
    - "Phenomenal consciousness, subjective qualia, sentience, or moral patienthood are NOT proved or claimed; all 14 Butlin indicators and 10 framework suites are strictly [INDICATOR-ONLY] computational proxies."
peer_review_status: "Not peer-reviewed; independent technical preprint and open-source artifact."
statement_fidelity_audit: "docs/statement-fidelity.md"
