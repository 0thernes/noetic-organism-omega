    email: "0_0@0thernes.art"
    credit_roles:
      - Conceptualization
      - Methodology
      - Supervision
      - Validation
      - Writing - review & editing
toolchain: "leanprover/lean4:v4.35.0"
mathlib_dependency: false
module_system: true
lean_root: "lean"
spec_module: "lean/NoeticProofs/Spec.lean"
live_receipt_module: "lean/NoeticProofs/LiveC11Receipt.lean"
proof_modules:
  - "lean/NoeticProofs.lean"
  - "lean/AdversarialTests.lean"
challenge_module: "lean/Challenge.lean"
solution_module: "lean/Solution.lean"
comparator_config: "lean/comparator.json"
audit_entrypoint: "lean/VerifyAxioms.lean"
negative_test_script: "scripts/test_lean_negative.py"
theorem_count: 68
parametric_and_adversarial_count: 46
bookkeeping_numeral_count: 18
live_receipt_check_count: 4
adversarial_refutation_count: 8
axiom_breakdown:
  zero_axioms: 40
  propext_and_or_quot_sound_only: 27
  uses_classical_choice: 1
permitted_axioms:
  - propext
  - Quot.sound
  - Classical.choice
forbidden_axioms:
  - sorryAx
  - Lean.ofReduceBool
  - Lean.trustCompiler
  - _native.bv_decide
kernels:
  - name: "Lean 4.35.0 reference kernel"
    command: "lake build && lake env leanchecker --fresh Solution"
  - name: "leanchecker-paranoid"
    command: "lake env leanchecker-paranoid --fresh Solution"
  - name: "lean4lean"
    command: "lake check --paranoid"
  - name: "nanoda_bin (Rust)"
    command: "lake env nanoda_bin nanoda.json"
  - name: "con-leche (--verified)"
    command: "lake env con-leche --verified sol.export"
  - name: "con-ron (--verified)"
    command: "lake env con-ron --verified sol.export"
comparator_command_ci: "cd lean && lake comparator --config comparator.json --paranoid"
negative_check_command_ci: "python3 scripts/test_lean_negative.py --comparator"
automation_and_ai_disclosure:
  status: "AI-assisted research under human direction"
  tools: "Frontier LLM coding and formalization assistants (Claude / Gemini agentic workflows)"
  human_oversight: "Alexander Stephen Donahue set research goals, invariants, epistemic boundaries, and validated builds, multi-kernel audits, and receipts."
scope_and_non_formalized_disclaimers:
  formalized_scope:
    - "Unbounded-Int field-sum and 11-slot residual conservation for both Ledger10 (10 fields, N01..N10, N49, N54) and full 11-slot Ledger11 (pools[0..10] + initialTotal, N55..N59), heat-field p8 non-decrease, non-negativity preservation, solar inflow updating both p6 and p10, and adversarial refutations of unguarded/imbalanced variants (A01, A02, A05, A07)."
    - "Pair-projection identity for the forked observer (N11), abstract region<4 edit-guard identity and tight boundary at region=4 (N25, N50, N51, A03 — not a hardware ACL proof), (w+d)-d=w (N26), XPBD area bound (N28), packed b1.58 2-bit roundtrip on {-1,0,1} and failure at w=2 (N29, A04), strict 1.6x fasting ratio equivalence (N30, N60), Q<=10 cap tight at Q=11 (N33, N52), Philox domain tuple distinctness (N35), triangular sum 2*sum1To n = n(n+1) (N15), Holm multiplier bound (N17), seed partition disjointness and zero-seed rejection (N20, N53, A06), and signed-Int lower-bound refutation (A08)."
    - "18 closed numeral identities (N12, N13, N16, N23, N27, N31, N34, N38..N47, N52) explicitly tagged as bookkeeping arithmetic that certify nothing about runtime engine behavior."
    - "4 live C11 receipt constant decide-checks (N24, N32, N48, N59) verifying constants exported by noetic_engine export-lean 5001 (0-bit identical across Win64 Clang and Linux GCC, diff-verified in CI)."
  not_formalized_in_lean:
    - "The C11 source files (src/*.c) and int64_t overflow bounds are NOT formally verified via VST/CompCert; bridge fidelity rests on cross-OS 0-bit receipt diffing, -Wall -Wextra -Werror -ffp-contract=off, ASan/UBSan in CI, 5 compiled Anti-LARP mutants, and 825 native checks."
    - "The WSE spectral norm bound ||W||_2 <= 0.99 is empirically audited in GATE-09, not proved in Lean."
    - "The 8 portable IEEE-754 math functions (noetic_{exp,log,log2,tanh,sin,cos,atan2,hypot}_det) are empirically audited (max_rel_err = 2.274e-16 in HW15), not formally proved in Lean/Flocq."
    - "Phenomenal consciousness, subjective qualia, sentience, or moral patienthood are NOT proved or claimed; all 14 Butlin indicators and 10 framework suites are strictly [INDICATOR-ONLY] computational proxies."
peer_review_status: "Not peer-reviewed; independent technical preprint and open-source artifact."
statement_fidelity_audit: "docs/statement-fidelity.md"
